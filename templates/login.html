<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · LibraryOS</title>
<script>
  (function () {
    var saved = localStorage.getItem('lms-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
<script type="module" src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(79,70,229,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(124,58,237,0.16), transparent 45%),
      var(--bg);
    padding: 24px;
  }
  .login-shape {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.5;
  }
  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    background: var(--surface-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    padding: 40px 36px;
    animation: card-rise 550ms var(--ease-smooth) both;
  }
  .login-logo {
    width: 52px; height: 52px;
    border-radius: var(--radius-md);
    background: var(--grad-primary);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: var(--shadow-glow);
    margin: 0 auto 20px;
  }
  .login-title { text-align: center; font-size: 22px; margin-bottom: 4px; }
  .login-subtitle { text-align: center; color: var(--text-secondary); font-size: 13.5px; margin-bottom: 30px; }
  .password-toggle {
    position: absolute;
    right: 14px; top: 15px;
    color: var(--text-muted);
    cursor: pointer;
    background: none; border: none;
    display: flex;
  }
  .remember-row { display: flex; align-items: center; justify-content: space-between; margin: -8px 0 22px; font-size: 13px; }
  .remember-check { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer; }
  .remember-check input { accent-color: var(--indigo); width: 15px; height: 15px; cursor: pointer; }
  .login-error {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    color: var(--coral);
    font-size: 13px;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .demo-hint {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

<div class="login-screen">
  <!-- Floating decorative shapes (abstract, book-inspired outlines) -->
  <svg class="login-shape float-a" style="top:12%;left:8%;" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="var(--indigo)" stroke-width="1.2" opacity="0.25"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
  <svg class="login-shape float-b" style="bottom:15%;right:10%;" width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="1.2" opacity="0.2"><circle cx="12" cy="12" r="10"/></svg>
  <svg class="login-shape float-c" style="top:60%;left:15%;" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--sky)" stroke-width="1.4" opacity="0.25"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
  <svg class="login-shape float-a" style="top:20%;right:16%;" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--indigo)" stroke-width="1.2" opacity="0.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>

  <div class="login-card">
    <div class="login-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>
    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to manage your library</p>

    {% if error %}
    <div class="login-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="login-form" action="{{ url_for('login') }}">
      <div class="form-group">
        <input type="text" name="username" id="username" class="form-input" placeholder=" " autocomplete="username" required>
        <svg class="form-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <label class="form-label" for="username">Username</label>
      </div>

      <div class="form-group" style="position:relative;">
        <input type="password" name="password" id="password" class="form-input" placeholder=" " autocomplete="current-password" required style="padding-right:42px;">
        <svg class="form-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <label class="form-label" for="password">Password</label>
        <button type="button" class="password-toggle" onclick="togglePassword()">
          <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="remember-row">
        <label class="remember-check">
          <input type="checkbox" name="remember">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;" id="login-btn">
        <span class="btn-label">Sign in</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="demo-hint">demo login → admin / admin123</p>
  </div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = isHidden
      ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
  }

  document.getElementById('login-form').addEventListener('submit', function () {
    const btn = document.getElementById('login-btn');
    btn.classList.add('is-loading');
    btn.disabled = true;
  });

  window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
</script>
</body>
</html>
